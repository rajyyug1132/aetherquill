name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# Two crates, no root workspace: test each in its own directory.
# Same checks as release.yml; nothing here builds for or talks to a tablet.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Recognizer (parity + end-to-end)
      run: cd recognizer && cargo test --verbose
    - name: Device host tests
      run: cd device && cargo test --lib --verbose
