[package]
name = "device"
version = "0.3.3"
edition = "2021"

[[bin]]
name = "aetherquill"
path = "src/main.rs"

[dependencies]
recognizer = { path = "../recognizer" }
libc = "0.2"
font8x8 = "0.3"
serde = { version = "1", features = ["derive"] } # catalogue.json (already in the tree via recognizer)
serde_json = "1"

[profile.release]
lto = true
strip = true
